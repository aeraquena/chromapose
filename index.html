<!doctype html>
<html>
  <head>
    <title>chromapose</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono:400,700" rel="stylesheet">
    <link rel="stylesheet" href='./styles.css'>
    <meta 
         name='viewport' 
         content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' 
    />
  </head>
  <body>
    
    <div id="screen"></div>
    <div id="instructions">
      <p class="centered"><strong>chromapose</strong></p>

      <ol>
        <li>Anyone can join the game by visiting <strong>chromapose.me</strong> on their phone</li>
        <li>Move your phone until the inner color matches the shared outer color</li>
        <li>When someone matches the outer color, it changes for everyone</li>
        <li>Match it again</li>
      </ol>

     <p class="centered">a game by
      <a href="http://clairekwong.com" target="_blank"><strong>Claire Kwong</strong></a></p>
    </div>

    <div id="top" class="info">
      <div id="score">0</div>
      <div id="instructionsLink">?</div>
    </div>

    <div id="bottom" class="info">
      <div id='playerCount'></div>
    </div>

    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src='./game.js'></script>
    <script src='./client.js'></script>
  </body>
</html>
