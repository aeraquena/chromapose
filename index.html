<!doctype html>
<html>
  <head>
    <title>chromapose</title>
    <link rel="stylesheet" href='./styles.css'>
    <!--<meta 
         name='viewport' 
         content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' 
    />-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  </head>
  <body>
    
    <!-- Start Chromapose -->
    <div id="screen"></div>
    <div id="content">
      <div>Hue: <span id="hue" class="value"></span></div>
      <div id="saturationDiv">Saturation: <span id="saturation" class="value"></span>%</div>
      <div>Lightness: <span id="lightness" class="value"></span>%</div>

    </div>
    <script type="text/javascript">

      // MOVEMENT

      var rotDeg, leftRight, frontBack;
      var hue, saturation, lightness;
      saturation = 50; // temporary
      var targetHue, targetSaturation, targetLightness; // unused

      // Map value from one range onto another
      function map(value, xMin, xMax, yMin, yMax) {

        // Clamp
        if (value < xMin) {
          return yMin;
        } else if (value > xMax) {
          return yMax;
        } else {
          var result = (value - xMin) * ((yMax - yMin)/(xMax - xMin)) + yMin;
          return result;
        }
      }

      // Detect if browser supports orientation
      if (typeof window.orientation !== 'undefined') { 
        // Mobile
        console.log('Mobile');

        // Device orientation
        if (window.DeviceOrientationEvent) {
            window.addEventListener("deviceorientation", function(event) {
                // alpha: rotation around z-axis
                rotDeg = event.alpha;
                // gamma: left to right
                leftRight = event.gamma;
                // beta: front back motion
                frontBack = event.beta;

                // Left right rotation (around X-axis)
              $('span.value.lr').text(leftRight.toFixed(2));
              $('#lr').width(leftRight + 90);

              // Front back rotation (around Y-axis)
              $('span.value.fb').text(frontBack.toFixed(2));
              $('#fb').width(frontBack + 180);

              // Alpha rotation (around Z-axis)
              $('span.value.rotdeg').text(rotDeg.toFixed(2));
              $('#rotdeg').width(rotDeg);

              // X = saturation
              //saturation = Math.floor(map(leftRight, -90, 90, 0, 100));

              // Y = lightness
              lightness = Math.floor(map(frontBack, -180, 180, 0, 100));

              // Z = hue
              hue = Math.floor(map(rotDeg, 0, 360, 0, 255));

              // Change color
              $('#hue').text(hue);
              $('#saturation').text(saturation);
              $('#lightness').text(lightness);

              // Change background color
              $('#screen').css('background-color', 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)');

              // Log target and user colors
              console.log('--');
              console.log('Target: ' + $('#screen').css('border-color'));
              console.log('User: ' + $('#screen').css('background-color'));
            }, true);
        }
      } else {
        // Desktop
        console.log('Desktop');

        var bodyWidth = $('body').width();
        var bodyHeight = $('body').height();

        saturation = 50;

        $("body").mousemove(function(e) {

            hue = Math.floor(map(e.pageX, 0, bodyWidth, 0, 255));
            lightness = Math.floor(map(e.pageY, 0, bodyHeight, 0, 100));

            // Change color
            $('#hue').text(hue);
            $('#saturation').text(saturation);
            $('#lightness').text(lightness);

            // Change background color
            $('#screen').css('background-color', 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)');

            // TODO: store values on the server
            var targetHue = Math.floor(map(doubloon.x, 0, 2400, 0, 255));
            var targetLightness = Math.floor(map(doubloon.y, 0, 2400, 0, 100));

            // Log target and user colors
            console.log('--');
            console.log('Target: ' + targetHue + ', ' + targetLightness);
            console.log('User: ' + hue + ', ' + lightness);
        })
        var e = window.event;
      }

    </script>
    <!-- End Chromapose -->

    <div class='sidebar'>
      <div id='playerCount'></div>
      <div id='scores'></div>
    </div>
    <canvas id="game" width="500" height="500"></canvas>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src='./game.js'></script>
    <script src='./client.js'></script>
  </body>
</html>
