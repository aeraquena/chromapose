<!doctype html>
<html>
  <head>
    <title>chromapose</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono:400,700" rel="stylesheet">
    <link rel="stylesheet" href='./styles.css'>
    <meta 
         name='viewport' 
         content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' 
    />
  </head>
  <body>
  	<!-- Code adapted from https://github.com/sgoedecke/socket-io-game -->
    <div id="screen"></div>
    
    <div id="splash">
      <p class="centered"><strong>chromapose</strong></p>
      <div id="start-buttons">
        <button id="join-game">join game</button>
        <button id="new-game">new game</button>
      </div>
      <div id="input-number-container">#<input type="number" id="input-number">
        <button id="join-game-number">join</button>
      </div>
    </div>

    <div id="instructions">
      <p class="centered"><strong>chromapose</strong></p>

      <ol>
        <li>Anyone can join by visiting <strong>chromapose.me</strong> on their phone</li>
        <li>Move your phone to change the inner color and match the outer color</li>
        <li>When everyone matches the outer color, it <span id="change-outer-color">changes</span></li>
      </ol>

     <p class="centered">a game by
      <a href="http://clairekwong.com" target="_blank"><strong>Claire Kwong</strong></a></p>
    </div>

    <div id="top">
      <div id="gameId">#1</div>
    </div>

    <div id="bottom">
      <div id='playerCount'></div>
      <div id="instructionsLink">?</div>
    </div>

    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src='./game.js'></script>
    <script src='./client.js'></script>
  </body>
</html>
