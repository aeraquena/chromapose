<!doctype html>
<html>
  <head>
    <title>Pirates!</title>
    <link rel="stylesheet" href='./styles.css'>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  </head>
  <body>
    
    <!-- Start Chromapose -->
    <div id="screen"></div>
    <div id="content">
      <!-- <div class="label">Left-Right Rotation (Y Axis): <span class="value lr"></span>&deg;</div>
      <div class="meter" id="lr"></div>

      <div class="label">Front-Back Rotation (X Axis): <span class="value fb"></span>&deg;</div>
      <div class="meter" id="fb"></div>

      <div class="label">Alpha Rotation (Z axis): <span class="value rotdeg"></span>&deg;</div>
      <div class="meter" id="rotdeg"></div>

      <br/>-->

      <div>Hue: <span id="hue" class="value"></span></div>
      <div>Saturation: <span id="saturation" class="value"></span>%</div>
      <div>Lightness: <span id="lightness" class="value"></span>%</div>
      
      <div id='playerCount'></div>
    </div>
    <script type="text/javascript">

      // MOVEMENT

      var rotDeg, leftRight, frontBack;
      var hue, saturation, lightness;
      var targetHue, targetSaturation, targetLightness;

      // Map value from one range onto another
      function map(value, xMin, xMax, yMin, yMax) {

        // Clamp
        if (value < xMin) {
          return yMin;
        } else if (result > yMax) {
          return yMax;
        } else {
          var result = (value - xMin) * ((yMax - yMin)/(xMax - xMin)) + yMin;
          return result;
        }
      }

      // Generates a target color
      // Unused
      function generateTargetColor() {
        targetHue = Math.floor(Math.random() * 255);
        targetSaturation = Math.floor(Math.random() * 100);
        targetLightness = Math.floor(Math.random() * 100);
        $('#screen').css('border-color', 'hsl(' + targetHue + ', ' + targetSaturation + '%, ' + targetLightness + '%)');
      }
      generateTargetColor();

      // Device orientation
      if (window.DeviceOrientationEvent) {
          window.addEventListener("deviceorientation", function(event) {
              // alpha: rotation around z-axis
              rotDeg = event.alpha;
              // gamma: left to right
              leftRight = event.gamma;
              // beta: front back motion
              frontBack = event.beta;

              // Left right rotation (around X-axis)
          $('span.value.lr').text(leftRight.toFixed(2));
          $('#lr').width(leftRight + 90);

          // Front back rotation (around Y-axis)
          $('span.value.fb').text(frontBack.toFixed(2));
          $('#fb').width(frontBack + 180);

              // Alpha rotation (around Z-axis)
              $('span.value.rotdeg').text(rotDeg.toFixed(2));
              $('#rotdeg').width(rotDeg);

          // X = saturation
          saturation = Math.floor(map(leftRight, -90, 90, 0, 100));

          // Y = lightness
          lightness = Math.floor(map(frontBack, -180, 180, 0, 100));

          // Z = hue
          hue = Math.floor(map(rotDeg, 0, 360, 0, 255));

          $('#hue').text(hue);
          $('#saturation').text(saturation);
          $('#lightness').text(lightness);

          // Change background color
          $('#screen').css('background-color', 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)');
          }, true);
      }

    </script>
    <!-- End Chromapose -->

    <div class='sidebar'>
      <div id='scores'></div>
    </div>
    <canvas id="game" width="500" height="500"></canvas>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src='./game.js'></script>
    <script src='./client.js'></script>
  </body>
</html>
