<!doctype html>
<html>
  <head>
    <title>chromapose</title>
    <link rel="stylesheet" href='./styles.css'>
    <!--<meta 
         name='viewport' 
         content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' 
    />-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  </head>
  <body>
    
    <!-- Start Chromapose -->
    <div id="screen"></div>
    <div id="content">
      <div id="color-info">
        <div>Hue: <span id="hue" class="value"></span></div>
        <div id="saturationDiv">Saturation: <span id="saturation" class="value"></span>%</div>
        <div>Lightness: <span id="lightness" class="value"></span>%</div>
        <br/>
        <div>Target Hue: <span id="targetHue" class="value"></span></div>
        <div id="saturationDiv">Saturation: <span id="saturation" class="value"></span>%</div>
        <div>Target Lightness: <span id="targetLightness" class="value"></span>%</div>
      </div>
      <div id="match">MATCH</div>

    </div>
    <!-- End Chromapose -->

    <div class='sidebar'>
      <div id='playerCount'></div>
      <div id='scores'></div>
    </div>
    <canvas id="game" width="500" height="500"></canvas>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src='./game.js'></script>
    <script src='./client.js'></script>
  </body>
</html>
