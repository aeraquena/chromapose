  	<h2>Motion Access</h2>
  	
    Is the background of <a href="http://chromapose.me">chromapose.me</a> black?

  	<br/><br/>

    If you're using <strong>Safari</strong> on <strong>iOS</strong>, go to <strong>Settings</strong> and scroll down to <strong>Safari</strong>.<br/><br/>

    <img src="motion1.png" width="100%"><br/><br/>

    Under <strong>Privacy & Security</strong>, enable <strong>Motion & Orientation Access</strong>.<br/><br/>

    <img src="motion2.gif" width="100%"><br/><br/>

    Now reload <a href="http://chromapose.me">chromapose.me</a>. Make sure the background changes colors when you move!<br/><br/>

    <img src="motion3.gif" width="100%">
