<!DOCTYPE html>
<html lang="en">
	<head>
		<title>with you</title>
		<meta charset="utf-8">
		<meta name="viewport" content="user-scalable=no, initial-scale=1">
		<link rel="stylesheet" href='./styles.css'>
		<style>
			body {
				margin: 0px;
				background-color: #000000;
				overflow: hidden;
			}
		</style>
	</head>
	<body>

		<script src="./three.js"></script>
		<script src="./DeviceOrientationControls.js"></script>
		<script src="https://code.jquery.com/jquery-1.11.1.js"></script>
	    <script src="/socket.io/socket.io.js"></script>
	    <script src='./game.js'></script>
	    <script src='./client.js'></script>

		<script>

			var camera, scene, renderer, controls, targetBall;

			var currentPosition, nextPosition;
			var lerpPercent = 0;

			var radius = 5;

			init();
			animate();

			function init() {

				camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 1100 );

				controls = new THREE.DeviceOrientationControls( camera );

				scene = new THREE.Scene();

				// Sphere wireframe

				var geometry = new THREE.SphereBufferGeometry( 500, 30, 20 );
				// invert the geometry on the x-axis so that all of the faces point inward
				geometry.scale( - 1, 1, 1 );

				var material = new THREE.MeshBasicMaterial( { color: 0xffffff, wireframe: true } );

				var mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				// target ball

				var geometry = new THREE.BoxGeometry( 1, 1, 1 );
				var material = new THREE.MeshBasicMaterial( { color: 0xff0000 } ); // red
				targetBall = new THREE.Mesh( geometry, material );
				scene.add( targetBall );

				// in front of you
				currentPosition = {
					'x': -90,
					'y': 0
				}

				nextPosition = {
					'x': Math.floor(Math.random() * 180) + 180,
					'y': Math.floor(Math.random() * 180) - 90
				}

				window.addEventListener( 'resize', onWindowResize, false );
			}

			function animate() {

				window.requestAnimationFrame( animate );

				if (lerpPercent >= 1) {
					currentPosition = nextPosition;

					// Generate new nextPosition, coordinates between -5 and 5
					nextPosition = {
						'x': Math.floor(Math.random() * 180) + 180,
						'y': Math.floor(Math.random() * 180) - 90
					}

					lerpPercent = 0;
				}

				targetBall.position.setFromSphericalCoords(
					radius, 
					THREE.Math.degToRad(currentPosition.x + ((nextPosition.x - currentPosition.x) * lerpPercent)), 
					THREE.Math.degToRad(currentPosition.y + ((nextPosition.y - currentPosition.y) * lerpPercent))
				);

				controls.update();
				renderer.render( scene, camera );

				// Check frustum (whether object is in view)
				camera.updateMatrix();
				camera.updateMatrixWorld();

				var frustum = new THREE.Frustum();
				frustum.setFromMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));  

				// Your 3d point to check
				var pos = new THREE.Vector3(targetBall.position.x, targetBall.position.y, targetBall.position.z);
				if (frustum.containsPoint(pos)) {
				    // Do something with the position...
				    console.log('IN VIEW');
				} else {
					console.log('---');
				}

				lerpPercent += .01;
			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

		</script>

		<div id="splash">
	        <p class="centered title"><strong>chromapose</strong></p>
	        <p class="subtitle centered">anyone can join with<br/>
	          <strong>chromapose.me</strong><br/>
	          on their phone</p>
	        <div id="start-buttons">
	          <button id="new-game">new game</button>
	          <p class="subtitle">or join game</p>
	          <div id="input-number-container">
	            <div id="input-number-outer">#<input type="number" id="input-number"></div>
	            <button id="join-game-number">join</button>
	          </div>
	        </div>
	    </div>
	</body>
</html>
