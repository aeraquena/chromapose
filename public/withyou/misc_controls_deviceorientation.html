<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - controls - deviceorientation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="user-scalable=no, initial-scale=1">
		<style>
			body {
				margin: 0px;
				background-color: #000000;
				overflow: hidden;
			}

			#info {
				position: absolute;
				top: 0px; width: 100%;
				color: #ffffff;
				padding: 5px;
				font-family:Monospace;
				font-size:13px;
				font-weight: bold;
				text-align:center;
				box-sizing: border-box;
			}

			a {
				color: #ff8800;
			}
		</style>
	</head>
	<body>

		<script src="./three.js"></script>
		<script src="./DeviceOrientationControls.js"></script>

		<script>

			var camera, scene, renderer, controls, targetBall;

			init();
			animate();

			function init() {

				camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 1100 );

				controls = new THREE.DeviceOrientationControls( camera );

				scene = new THREE.Scene();

				// Sphere wireframe

				var geometry = new THREE.SphereBufferGeometry( 500, 30, 20 );
				// invert the geometry on the x-axis so that all of the faces point inward
				geometry.scale( - 1, 1, 1 );

				var material = new THREE.MeshBasicMaterial( { color: 0xffffff, wireframe: true } );

				var mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				// target ball

				//var geometry = new THREE.SphereGeometry( 1, 32, 32 );
				var geometry = new THREE.BoxGeometry( 1, 1, 1 );
				var material = new THREE.MeshBasicMaterial( { color: 0x00ff00 } );
				targetBall = new THREE.Mesh( geometry, material );
				scene.add( targetBall );

				window.addEventListener( 'resize', onWindowResize, false );
			}

			// Set the target ball's orbital radius, start angle, and angle increment value
			var r = 5;
			var theta = 0;
			var dTheta = 2 * Math.PI / 1000;

			var frameCount = 0;
			var xMultiplier, yMultiplier, zMultiplier;

			function animate() {

				window.requestAnimationFrame( animate );

				// Rotate target ball
				//Increment theta, and update moon x and y
				//position based off new theta value        

				// change angles every 5 seconds
				// position changes though
				if (frameCount % 300 == 0) {
					/*xMultiplier = (Math.random() * 10) - 5;
					yMultiplier = (Math.random() * 10) - 5;
					zMultiplier = (Math.random() * 10) - 5;*/

					console.log('randomize angle');

					/*var angleX = Math.random();
					var angleY = Math.random();
					var angleZ = Math.random();

					var quaternion = new THREE.Quaternion();
					quaternion.setFromAxisAngle( new THREE.Vector3(angleX, angleY, angleZ), Math.PI / 2 );
					targetBall.matrix.makeRotationFromQuaternion(quaternion);*/

					// 30 degrees
					targetBall.rotateOnWorldAxis(new THREE.Vector3(1,0,0), 30 * Math.PI/180);
				}

				theta += dTheta;
				targetBall.position.x = r * Math.cos(theta);// * xMultiplier;
				targetBall.position.z = r * Math.sin(theta);// * yMultiplier;
				//targetBall.position.y = Math.sin(theta) * zMultiplier;

				controls.update();
				renderer.render( scene, camera );

				// Check frustum (whether object is in view)
				camera.updateMatrix();
				camera.updateMatrixWorld();

				var frustum = new THREE.Frustum();
				frustum.setFromMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));  

				// Your 3d point to check
				var pos = new THREE.Vector3(targetBall.position.x, targetBall.position.y, targetBall.position.z);
				if (frustum.containsPoint(pos)) {
				    // Do something with the position...
				    console.log('IN VIEW');
				} else {
					console.log('---');
				}

				frameCount++;
			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

		</script>
	</body>
</html>
