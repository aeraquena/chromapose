<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - controls - deviceorientation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="user-scalable=no, initial-scale=1">
		<style>
			body {
				margin: 0px;
				background-color: #000000;
				overflow: hidden;
			}

			#info {
				position: absolute;
				top: 0px; width: 100%;
				color: #ffffff;
				padding: 5px;
				font-family:Monospace;
				font-size:13px;
				font-weight: bold;
				text-align:center;
				box-sizing: border-box;
			}

			a {
				color: #ff8800;
			}
		</style>
	</head>
	<body>

		<script src="./three.js"></script>
		<script src="./DeviceOrientationControls.js"></script>

		<script>

			var camera, scene, renderer, controls, cube, cube2;

			init();
			animate();

			function init() {

				camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 1100 );

				controls = new THREE.DeviceOrientationControls( camera );

				scene = new THREE.Scene();

				var geometry = new THREE.SphereBufferGeometry( 500, 60, 40 );
				// invert the geometry on the x-axis so that all of the faces point inward
				geometry.scale( - 1, 1, 1 );

				var material = new THREE.MeshBasicMaterial( {
					map: new THREE.TextureLoader().load( 'textures/2294472375_24a3b8ef46_o.jpg' )
				} );

				var mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				var helperGeometry = new THREE.BoxBufferGeometry( 100, 100, 100, 4, 4, 4 );
				var helperMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff, wireframe: true } );
				var helper = new THREE.Mesh( helperGeometry, helperMaterial );
				scene.add( helper );

				//

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				//

				// Add cube
				var geometry = new THREE.BoxGeometry( 1, 1, 1 );
				var material = new THREE.MeshBasicMaterial( { color: 0x00ff00 } );
				cube = new THREE.Mesh( geometry, material );
				cube.position.x = 5;
				cube.position.y = 5;
				cube.position.z = 5;
				scene.add( cube );

				/*var geometry = new THREE.BoxGeometry( 1, 1, 1 );
				var material = new THREE.MeshBasicMaterial( { color: 0xff0000 } );
				cube2 = new THREE.Mesh( geometry, material );
				cube2.position.x = 10;
				cube2.position.y = 0;
				cube2.position.z = 0;
				scene.add( cube2 );*/

				//camera.position.z = 5;

				window.addEventListener( 'resize', onWindowResize, false );
			}

			var cubeDirectionX = 1;

			function animate() {

				window.requestAnimationFrame( animate );

				//cube.rotation.x += 0.01;
				//cube.rotation.y += 0.01;

				if (cube.position.x > 5) {
					cubeDirectionX = -1;
				} else if (cube.position.x < -5) {
					cubeDirectionX = 1;
				}

				if (cubeDirectionX == 1) {
					cube.position.x += 0.01;
				} else if (cubeDirectionX == -1) {
					cube.position.x -= 0.01;
				}

				controls.update();
				renderer.render( scene, camera );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

		</script>
	</body>
</html>
